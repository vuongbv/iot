---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: weiotservices-ingress
    namespace: weiotservices
    annotations:
       nginx.ingress.kubernetes.io/rewrite-target: /$1
       nginx.ingress.kubernetes.io/use-regex: "true"
       kubernetes.io/ingress.class: "nginx"
spec:
    rules:
      - host:
        http:
         paths:
           - path: /api/(.*)
             pathType: Prefix
             backend:
               service:
                 name: weiotservices    
                 port:
                   number: 80
status:
    loadBalancer:
       ingress:
         - ip: 20.205.254.51