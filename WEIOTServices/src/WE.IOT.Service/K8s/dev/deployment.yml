apiVersion: apps/v1
kind: Deployment
metadata:
  name: weiotservices
  namespace: weiotservices
  labels:
    app: weiotservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weiotservices
  template:
    metadata:
      labels:
        app: weiotservices
    spec:     
      containers:
        - name: weiotservices
          image: acrwedev111.azurecr.io/weiotservices:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: weiotservices-config
          args:
            - /server
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
    name: weiotservices
    namespace: weiotservices
spec:
    type: ClusterIP
    ports:
    - port: 80 
      protocol: TCP
      targetPort: 80
    selector:
        app: weiotservices
