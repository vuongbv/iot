# Deploy to Azure Kubernetes Service
# Build and push image to Azure Container Registry; Deploy to Azure Kubernetes Service
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main

resources:
  repositories:
  - repository: Common
    type: git
    name: 'Common'
    ref: main

variables:

  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: '86d2924b-5369-472f-895f-dff58a47e7a5'
  imageRepository: 'iotservices'
  containerRegistry: 'acrgtechpprod.azurecr.io'
  dockerfilePath: '**/Dockerfile'
  tag: 'latest'
  imagePullSecret: 'acrgtechpprod50701726-auth'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'


stages:
- stage: Build
  displayName: Build stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - checkout: self
    - checkout: Common
    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: 
          cp $(Build.SourcesDirectory)/$(Build.Repository.Name)/Dockerfile   $(Build.SourcesDirectory) && cd $(Build.SourcesDirectory) && ls
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

    - upload: $(Build.SourcesDirectory)/$(Build.Repository.Name)/src/Starhub.IOT.Service/K8s
      artifact: k8s

- stage: Deploy
  displayName: Deploy stage
  dependsOn: Build

  jobs:
  - deployment: Deploy
    displayName: Deploy
    pool:
      vmImage: $(vmImageName)
    environment: 'IOTServices-1959.iot'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: KubernetesManifest@0
            displayName: Create imagePullSecret
            inputs:
              action: createSecret
              secretName: $(imagePullSecret)
              dockerRegistryEndpoint: $(dockerRegistryServiceConnection)

          - task: KubernetesManifest@0
            displayName: Deploy to Kubernetes cluster
            inputs:
              action: deploy
              manifests: |
                $(Pipeline.Workspace)/k8s/staging/deployment.yml
                $(Pipeline.Workspace)/k8s/staging/configmap.yml
              imagePullSecrets: |
                $(imagePullSecret)
              containers: |
                $(containerRegistry)/$(imageRepository):$(tag)

