# Deploy to Azure Kubernetes Service
# Build and push image to Azure Container Registry; Deploy to Azure Kubernetes Service
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- dev

resources:
  repositories:
  - repository: WE.Common
    type: git
    name: 'WE.Common'
    ref: dev

variables:

  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: 'ff983f53-6efb-4404-aaaf-1a9d6d90c415'
  imageRepository: 'weiotservices'
  containerRegistry: 'acrwedev111.azurecr.io'
  dockerfilePath: '**/Dockerfile'
  tag: '$(Build.BuildId),last'
  imagePullSecret: 'acrwedev1111902b9ee-auth'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'


stages:
- stage: Build
  displayName: Build stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - checkout: self
    - checkout: WE.Common
    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: 
          cp $(Build.SourcesDirectory)/$(Build.Repository.Name)/Dockerfile   $(Build.SourcesDirectory) && cd $(Build.SourcesDirectory) && ls
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

    - upload: $(Build.SourcesDirectory)/$(Build.Repository.Name)/src/WE.IOT.Service/K8s
      artifact: k8s

- stage: Deploy
  displayName: Deploy stage
  dependsOn: Build

  jobs:
  - deployment: Deploy
    displayName: Deploy
    pool:
      vmImage: $(vmImageName)
    environment: 'WEIOTServices-1476.weiotservices'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: KubernetesManifest@0
            displayName: Create imagePullSecret
            inputs:
              action: createSecret
              secretName: $(imagePullSecret)
              dockerRegistryEndpoint: $(dockerRegistryServiceConnection)

          - task: KubernetesManifest@0
            displayName: Deploy to Kubernetes cluster
            inputs:
              action: deploy
              manifests: |
                $(Pipeline.Workspace)/k8s/dev/deployment.yml
                $(Pipeline.Workspace)/k8s/dev/configmap.yml
              imagePullSecrets: |
                $(imagePullSecret)
              containers: |
                $(containerRegistry)/$(imageRepository):latest
